# lazypunk-rebecca — native tmux theme
# Generated from lua/lazypunk/palettes/rebecca.lua by scripts/gen_tmux_conf.lua.
# Truecolor terminal required. Source from your ~/.tmux.conf:
#   source-file /path/to/lazypunk/tmux/lazypunk-rebecca.conf
# or via TPM: set -g @plugin 'achiurizo/lazypunk'  (+ set -g @lazypunk_variant 'rebecca')
#
# Set `@lazypunk_status off` BEFORE sourcing to skip the status bar (keep only
# the accent colors) -- e.g. when another status plugin owns the bar.

# --- palette (machine-readable; read with: tmux show-option -gqv @lazypunk_accent)
set -g @lazypunk_variant "rebecca"
set -g @lazypunk_bg       "#0d1512"
set -g @lazypunk_bg_dark  "#070d0a"
set -g @lazypunk_bg_float "#131c17"
set -g @lazypunk_bg_sel   "#234032"
set -g @lazypunk_border   "#2c4438"
set -g @lazypunk_fg      "#d5e4d8"
set -g @lazypunk_fg_dim  "#8ba699"
set -g @lazypunk_comment "#5f7568"
set -g @lazypunk_string  "#8fd694"
set -g @lazypunk_keyword "#ff6e9c"
set -g @lazypunk_number  "#ff9e48"
set -g @lazypunk_func    "#57c4bb"
set -g @lazypunk_accent  "#ff6e9c"
set -g @lazypunk_accent2 "#57c4bb"
set -g @lazypunk_warn    "#ffc24a"
set -g @lazypunk_error   "#ff5d7a"

# --- accents (pane borders, message, copy-mode, clock, display-panes)
set -g pane-border-style "fg=#2c4438"
set -g pane-active-border-style "fg=#ff6e9c"
set -g display-panes-colour "#2c4438"
set -g display-panes-active-colour "#ff6e9c"

set -g message-style "fg=#070d0a,bg=#57c4bb"
set -g message-command-style "fg=#070d0a,bg=#57c4bb"
set -g mode-style "fg=#070d0a,bg=#ffc24a"

set -g clock-mode-colour "#ff6e9c"

# --- status bar (skipped when @lazypunk_status is 'off')
%if "#{!=:#{@lazypunk_status},off}"
set -g status-style "fg=#d5e4d8,bg=#070d0a"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#070d0a,bg=#8fd694,bold] #S #[fg=#8fd694,bg=#070d0a] "
set -g status-right "#[fg=#8ba699] %Y-%m-%d #[fg=#d5e4d8,bold] %H:%M "

set -g window-status-separator ""
set -g window-status-current-format "#[fg=#070d0a,bg=#ff6e9c,bold] #I #W "
set -g window-status-format "#[fg=#8ba699] #I #W "
set -g window-status-activity-style "fg=#ffc24a"
set -g window-status-bell-style "fg=#ff5d7a"
%endif
