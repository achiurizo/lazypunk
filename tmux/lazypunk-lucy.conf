# lazypunk-lucy — native tmux theme
# Generated from lua/lazypunk/palettes/lucy.lua by scripts/gen_tmux_conf.lua.
# Truecolor terminal required. Source from your ~/.tmux.conf:
#   source-file /path/to/lazypunk/tmux/lazypunk-lucy.conf
# or via TPM: set -g @plugin 'achiurizo/lazypunk'  (+ set -g @lazypunk_variant 'lucy')
#
# Set `@lazypunk_status off` BEFORE sourcing to skip the status bar (keep only
# the accent colors) -- e.g. when another status plugin owns the bar.

# --- palette (machine-readable; read with: tmux show-option -gqv @lazypunk_accent)
set -g @lazypunk_variant "lucy"
set -g @lazypunk_bg       "#0f0d1e"
set -g @lazypunk_bg_dark  "#0a0814"
set -g @lazypunk_bg_float "#14122a"
set -g @lazypunk_border   "#3a3560"
set -g @lazypunk_fg      "#e7dcf0"
set -g @lazypunk_fg_dim  "#b1aaef"
set -g @lazypunk_comment "#6f6a9c"
set -g @lazypunk_string  "#7ef0d0"
set -g @lazypunk_keyword "#9d7cff"
set -g @lazypunk_number  "#c264e0"
set -g @lazypunk_accent  "#c264e0"
set -g @lazypunk_accent2 "#5b8cff"
set -g @lazypunk_warn    "#ffc14d"
set -g @lazypunk_error   "#ff5d8f"

# --- accents (pane borders, message, copy-mode, clock, display-panes)
set -g pane-border-style "fg=#3a3560"
set -g pane-active-border-style "fg=#9d7cff"
set -g display-panes-colour "#3a3560"
set -g display-panes-active-colour "#9d7cff"

set -g message-style "fg=#0a0814,bg=#5b8cff"
set -g message-command-style "fg=#0a0814,bg=#5b8cff"
set -g mode-style "fg=#0a0814,bg=#ffc14d"

set -g clock-mode-colour "#c264e0"

# --- status bar (skipped when @lazypunk_status is 'off')
%if "#{!=:#{@lazypunk_status},off}"
set -g status-style "fg=#e7dcf0,bg=#0a0814"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#0a0814,bg=#7ef0d0,bold] #S #[fg=#7ef0d0,bg=#0a0814] "
set -g status-right "#[fg=#b1aaef] %Y-%m-%d #[fg=#e7dcf0,bold] %H:%M "

set -g window-status-separator ""
set -g window-status-current-format "#[fg=#0a0814,bg=#9d7cff,bold] #I #W "
set -g window-status-format "#[fg=#b1aaef] #I #W "
set -g window-status-activity-style "fg=#ffc14d"
set -g window-status-bell-style "fg=#ff5d8f"
%endif
