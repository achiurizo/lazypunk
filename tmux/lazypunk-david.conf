# lazypunk-david — native tmux theme
# Generated from lua/lazypunk/palettes/david.lua by scripts/gen_tmux_conf.lua.
# Truecolor terminal required. Source from your ~/.tmux.conf:
#   source-file /path/to/lazypunk/tmux/lazypunk-david.conf
# or via TPM: set -g @plugin 'achiurizo/lazypunk'  (+ set -g @lazypunk_variant 'david')

set -g status-style "fg=#e6e8e0,bg=#070805"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#070805,bg=#93c46f,bold] #S #[fg=#93c46f,bg=#070805] "
set -g status-right "#[fg=#a7a99b] %Y-%m-%d #[fg=#e6e8e0,bold] %H:%M "

set -g window-status-separator ""
set -g window-status-current-format "#[fg=#070805,bg=#eddd3c,bold] #I #W "
set -g window-status-format "#[fg=#a7a99b] #I #W "
set -g window-status-activity-style "fg=#f7ef2e"
set -g window-status-bell-style "fg=#ff5a4d"

set -g pane-border-style "fg=#33372a"
set -g pane-active-border-style "fg=#eddd3c"
set -g display-panes-colour "#33372a"
set -g display-panes-active-colour "#eddd3c"

set -g message-style "fg=#070805,bg=#5fc9c2"
set -g message-command-style "fg=#070805,bg=#5fc9c2"
set -g mode-style "fg=#070805,bg=#f7ef2e"

set -g clock-mode-colour "#eddd3c"
