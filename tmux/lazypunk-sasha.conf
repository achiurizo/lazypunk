# lazypunk-sasha — native tmux theme
# Generated from lua/lazypunk/palettes/sasha.lua by scripts/gen_tmux_conf.lua.
# Truecolor terminal required. Source from your ~/.tmux.conf:
#   source-file /path/to/lazypunk/tmux/lazypunk-sasha.conf
# or via TPM: set -g @plugin 'achiurizo/lazypunk'  (+ set -g @lazypunk_variant 'sasha')
#
# Set `@lazypunk_status off` BEFORE sourcing to skip the status bar (keep only
# the accent colors) -- e.g. when another status plugin owns the bar.

# --- palette (machine-readable; read with: tmux show-option -gqv @lazypunk_accent)
set -g @lazypunk_variant "sasha"
set -g @lazypunk_bg       "#110b20"
set -g @lazypunk_bg_dark  "#0b0716"
set -g @lazypunk_bg_float "#17102c"
set -g @lazypunk_bg_sel   "#33225c"
set -g @lazypunk_border   "#40306b"
set -g @lazypunk_fg      "#ebdff5"
set -g @lazypunk_fg_dim  "#bda9f2"
set -g @lazypunk_comment "#766a9f"
set -g @lazypunk_string  "#7ef0d0"
set -g @lazypunk_keyword "#b388ff"
set -g @lazypunk_number  "#ff6ad5"
set -g @lazypunk_func    "#8d9bff"
set -g @lazypunk_accent  "#e058f5"
set -g @lazypunk_accent2 "#8d9bff"
set -g @lazypunk_warn    "#ffc14d"
set -g @lazypunk_error   "#ff5370"

# --- accents (pane borders, message, copy-mode, clock, display-panes)
set -g pane-border-style "fg=#40306b"
set -g pane-active-border-style "fg=#b388ff"
set -g display-panes-colour "#40306b"
set -g display-panes-active-colour "#b388ff"

set -g message-style "fg=#0b0716,bg=#8d9bff"
set -g message-command-style "fg=#0b0716,bg=#8d9bff"
set -g mode-style "fg=#0b0716,bg=#ffc14d"

set -g clock-mode-colour "#e058f5"

# --- status bar (skipped when @lazypunk_status is 'off')
%if "#{!=:#{@lazypunk_status},off}"
set -g status-style "fg=#ebdff5,bg=#0b0716"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#0b0716,bg=#7ef0d0,bold] #S #[fg=#7ef0d0,bg=#0b0716] "
set -g status-right "#[fg=#bda9f2] %Y-%m-%d #[fg=#ebdff5,bold] %H:%M "

set -g window-status-separator ""
set -g window-status-current-format "#[fg=#0b0716,bg=#b388ff,bold] #I #W "
set -g window-status-format "#[fg=#bda9f2] #I #W "
set -g window-status-activity-style "fg=#ffc14d"
set -g window-status-bell-style "fg=#ff5370"
%endif
